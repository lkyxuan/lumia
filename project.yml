name: Lumia
options:
  bundleIdPrefix: com.lumia
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Lumia Dev"
    DEVELOPMENT_TEAM: ""

targets:
  Lumia:
    type: application
    platform: macOS
    sources: [Lumia]
    settings:
      base:
        INFOPLIST_FILE: Lumia/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lumia.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.lumia.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

  LumiaTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LumiaTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Lumia
